  <title>Da Tropa</title>
  <style>
    :root { color-scheme: light dark; --fundo: #f6f6f4; --texto: #1d1d1b; --suave: #6b6b66; }
    @media (prefers-color-scheme: dark) { :root { --fundo: #161615; --texto: #ecece8; --suave: #9a9a94; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fundo);
           color: var(--texto); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 16px; }
    main { max-width: 32rem; }
    h1 { font-size: 1.75rem; margin: 0 0 .5rem; }
    p { margin: 0; color: var(--suave); }
  </style>
</head>
