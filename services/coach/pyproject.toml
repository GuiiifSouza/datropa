[project]
name = "coach"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.4",
    "google-cloud-bigquery>=3.46.2",
    "google-genai>=2.31.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
