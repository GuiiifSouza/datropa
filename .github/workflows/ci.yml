# Checagens de PR. Não autentica no GCP: o WIF só aceita a branch main.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
      - name: shellcheck
        run: find infra -name '*.sh' -print0 | xargs -0 -r shellcheck

  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # o checkout do PR é um merge; HEAD^1 é a base
      - id: mudou
        run: |
          if git diff --quiet HEAD^1 HEAD -- infra/firestore.rules infra/firestore-testes firebase.json; then
            echo "Regras do Firestore não mudaram neste PR. Teste pulado."
            echo "rodar=false" >> "$GITHUB_OUTPUT"
          else
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.mudou.outputs.rodar == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.mudou.outputs.rodar == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/firestore-testes/package-lock.json
      - name: Teste das regras no emulador
        if: steps.mudou.outputs.rodar == 'true'
        working-directory: infra/firestore-testes
        run: |
          npm ci
          npm test

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: [stats, coach, ingest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # o checkout do PR é um merge; HEAD^1 é a base
      - name: Build da imagem (sem push)
        env:
          SERVICO: ${{ matrix.servico }}
        run: |
          pasta="services/$SERVICO"
          if [ ! -f "$pasta/Dockerfile" ]; then
            echo "::notice::$pasta ainda não tem Dockerfile. Build pulado."
            exit 0
          fi
          if git diff --quiet HEAD^1 HEAD -- "$pasta"; then
            echo "$pasta não mudou neste PR. Build pulado."
            exit 0
          fi
          docker build -t "$SERVICO:pr" "$pasta"

  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # o checkout do PR é um merge; HEAD^1 é a base
      - id: mudou
        run: |
          if git diff --quiet HEAD^1 HEAD -- front; then
            echo "front/ não mudou neste PR. Build pulado."
            echo "rodar=false" >> "$GITHUB_OUTPUT"
          else
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.mudou.outputs.rodar == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Tipos e build do front
        if: steps.mudou.outputs.rodar == 'true'
        working-directory: front
        run: |
          npm ci
          npm run tipos
          npm run build
